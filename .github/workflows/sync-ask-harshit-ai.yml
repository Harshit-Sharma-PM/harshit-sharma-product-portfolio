name: Sync Ask Harshit AI vectors

on:
  push:
    branches:
      - main
    paths:
      - "artifacts/harshit-portfolio/src/ask-ai-knowledge.ts"
      - "scripts/sync-ask-harshit-vectorize.mjs"
      - ".github/workflows/sync-ask-harshit-ai.yml"
  workflow_dispatch:

jobs:
  sync-vectors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Vectorize index
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VECTORIZE_INDEX_NAME: ask-harshit-ai
        run: node scripts/sync-ask-harshit-vectorize.mjs
